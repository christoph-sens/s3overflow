name: Secrets check (temporary)

on:
  push:
    branches: [secrets-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Sign publication locally (nothing is uploaded)
        run: |
          ./gradlew publishToMavenLocal -PreleaseVersion=0.0.0-secrets-check --no-configuration-cache
          ls ~/.m2/repository/com/christoph-sens/s3overflow/0.0.0-secrets-check/*.asc
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      - name: Verify signature against the key on keyserver.ubuntu.com
        run: |
          gpg --keyserver keyserver.ubuntu.com --recv-keys 6F77D9D445597A9ADC455E769E7775B3CD3CFC3A
          f=$(ls ~/.m2/repository/com/christoph-sens/s3overflow/0.0.0-secrets-check/s3overflow-0.0.0-secrets-check.jar)
          gpg --verify "$f.asc" "$f"
      - name: Authenticate against Maven Central (read-only request)
        run: |
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=com.christoph-sens&name=s3overflow&version=1.0.0")
          echo "HTTP $code"
          [ "$code" = 200 ] || { echo "::error::Maven Central rejected the token (HTTP $code)"; exit 1; }
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
